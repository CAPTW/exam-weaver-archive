name: Rebrand foundation checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebrand-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install contract-test dependency
        run: python -m pip install pytest

      - name: Verify menu and launcher contracts
        run: python -m pytest -q --noconftest tests/test_menu_language.py tests/test_launchers.py

  branding-contract:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify branding, menu, and launcher contracts
        shell: pwsh
        run: |
          python -m pytest -q tests/test_main_window_layout.py tests/test_menu_language.py tests/test_launchers.py
